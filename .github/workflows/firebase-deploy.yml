# Publica Rosita Personal en Firebase Hosting y actualiza las reglas de seguridad
# (manual, opcional; la publicación normal es GitHub Pages).
name: Publicar Rosita Personal
on:
  workflow_dispatch:  # manual: requiere el secreto FIREBASE_SERVICE_ACCOUNT
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Credenciales de Firebase
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Publicar (hosting + reglas)
        run: npx firebase deploy --only hosting,firestore:rules --project "${{ vars.FIREBASE_PROJECT_ID || 'rosita-personal' }}" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
