# Publica las reglas de seguridad de Firestore cada vez que cambia firestore.rules.
# Usa la misma llave de los avisos (ROSITA_SERVICE_ACCOUNT).
name: Reglas de seguridad
on:
  push:
    branches: [main]
    paths: [firestore.rules, firestore.indexes.json]
  workflow_dispatch:
jobs:
  reglas:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar reglas
        working-directory: avisos
        run: |
          npm ci --omit=dev --no-audit --no-fund
          node -e '
            const admin = require("firebase-admin"), fs = require("fs");
            admin.initializeApp({ credential: admin.credential.cert(JSON.parse(process.env.SA)) });
            admin.securityRules().releaseFirestoreRulesetFromSource(fs.readFileSync("../firestore.rules", "utf8"))
              .then(r => console.log("Reglas publicadas:", r.name))
              .catch(e => { console.error(e.message); process.exit(1); });'
        env:
          SA: ${{ secrets.ROSITA_SERVICE_ACCOUNT }}
