<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Rosita · Personal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="rosita.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rosita">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="app" class="screen"></main>
<script>
/* Sin zoom: iPhone ignora user-scalable=no, así que se bloquea el pellizco y el doble toque */
(function(){var o={passive:false};
['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},o);});
document.addEventListener('touchmove',function(e){if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault();},o);
var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300){e.preventDefault();}last=n;},o);
document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault();},o);
})();
</script>
<script type="module" src="app.js"></script>
</body>
</html>
